<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pizza-Time</title>
        <!-- Favicon -->
        <link rel="icon" href= "images/PizzaAura.png">

        <!-- Stylesheet-->
        <link rel = "stylesheet" href = "styles/pizza-styles.css">

    </head>
    <body> 

        <div id ="main">
            <!--Main Header-->
            <div id = "header">
                <img src="images/krusty-pizza.png">
            <h1>Welcome to Pizza-Time!</h1>
            <h2>Our Menu</h2>
            <hr>
            <p>We make the best pizza ever! Visit us today</p>
            <a id = "contact-button" href = "#" role = "button"> Contact Us!</a>
            </hr>
            </div>

            <!--The Pizza Form (Contact Info)-->

            <form id = "pizza-form" action = "#" method = "get">
                <!--Contact Info-->
                <fieldset>
                    <legend>Contact Info</legend>

                    <label for ="fname">First Name:</label>
                    <input type = "text" id="fname" name = "fname">

                    <label for = "lname">Last Name:</label>
                    <input type = "text" id = "lname" name = "lname">

                    <label for = "email">Email (not required):</label>
                    <input type = "email" id = "email" name = "email">
                </fieldset>

                <!--Order Button-->
                <button type = "submit" id = "order-button">Place Order</button>

                <fieldset>
                    <legend>Select Pickup or Delivery</legend>
                    <label for ="pickup">
                        <input type = "radio" id = "pickup" name = "method" value = 
                        "pickup">
                        pickup
                    </label>
                    <label for ="delivery">
                        <input type = "radio" id = "delivery" name = "method" value = 
                        "delivery">
                        delivery
                    </label>
                </fieldset>




            </form>
        </div>

    </body>
</html>
